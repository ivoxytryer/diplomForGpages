  <marker id="arrow-accent" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#a9853f"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Согласование отсутствия: без самоподтверждения</text>
<text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b7280">Заявку создаёт сам сотрудник; согласует вышестоящая роль; approved не редактируется напрямую</text>
<line x1="60" y1="110" x2="1740" y2="110" stroke="#e7e5e4" stroke-width="1.5"/>
<g>
  <rect x="100" y="170" width="340" height="160" rx="12" fill="#faf9f7" stroke="#d6d3d1" stroke-width="1.6"/>
  <foreignObject x="122" y="188" width="296" height="128">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;color:#1f2937;">
      <div style="font-size:21px;font-weight:650;line-height:1.15;margin-bottom:6px;">Создание заявки</div>
      <div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• сотрудник создаёт свою</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• HR и manager — только свою</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• admin — за любого</div>
    </div>
  </foreignObject>
</g><g>
  <rect x="500" y="170" width="300" height="160" rx="12" fill="#f5efe3" stroke="#a9853f" stroke-width="1.6"/>
