      <div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• MSW + localStorage, VITE_USE_MOCKS=true</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• миграция старых данных</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• быстрый вход по ролям</div>
