<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#6b7280"/></marker>
  <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#4a7554"/></marker>
  <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#a94f45"/></marker>
  <marker id="arrow-accent" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#a9853f"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Архив вместо удаления</text>
<text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6b7280">Увольнение сохраняет историю; физическое удаление — отдельная аварийная операция администратора</text>
<line x1="60" y1="110" x2="1740" y2="110" stroke="#e7e5e4" stroke-width="1.5"/>
<g>
  <rect x="160" y="190" width="380" height="150" rx="12" fill="#eef5ef" stroke="#4a7554" stroke-width="1.6"/>
  <foreignObject x="182" y="208" width="336" height="118">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;color:#1f2937;">
      <div style="font-size:20px;font-weight:650;line-height:1.15;margin-bottom:6px;">Сотрудник · active</div>
      <div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• работает, доступ активен</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• назначения и задачи актуальны</div>
    </div>
  </foreignObject>
</g><g>
  <rect x="620" y="420" width="440" height="170" rx="12" fill="#f5efe3" stroke="#a9853f" stroke-width="1.6"/>
  <foreignObject x="642" y="438" width="396" height="138">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;color:#1f2937;">
      <div style="font-size:20px;font-weight:650;line-height:1.15;margin-bottom:6px;">dismissed · архив</div>
      <div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• статус dismissed, дата увольнения</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• карточка и история сохранены</div><div style="margin-top:5px;color:#6b7280;font-size:15px;line-height:1.3;">• доступ закрыт, восстановление возможно</div>
    </div>
  </foreignObject>
</g><g>
  <rect x="1260" y="190" width="400" height="150" rx="12" fill="#fbeeec" stroke="#a94f45" stroke-width="1.6"/>
  <foreignObject x="1282" y="208" width="356" height="118">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;color:#1f2937;">
      <div style="font-size:19px;font-weight:650;line-height:1.15;margin-bottom:6px;">Физическое удаление</div>
      <div style="margin-top:5px;color:#6b7280;font-size:14px;line-height:1.3;">• только admin, не для увольнения</div><div style="margin-top:5px;color:#6b7280;font-size:14px;line-height:1.3;">• каскад: назначения, задачи, отпуска</div>
    </div>
  </foreignObject>
</g><path d="M 330 340 L 330 505 L 600 505" fill="none" stroke="#a9853f" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="470" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a9853f" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">admin: уволить</text><path d="M 620 455 L 290 455 L 290 352" fill="none" stroke="#4a7554" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/><text x="455" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a7554" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">admin: восстановить</text><line x1="540" y1="265" x2="1260" y2="265" stroke="#a94f45" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/><text x="900.0" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a94f45" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">admin: DELETE · каскад</text><line x1="840" y1="590" x2="840" y2="665" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/><text x="840.0" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">следствия</text><rect x="60" y="680" width="316" height="105" rx="8" fill="#ffffff" stroke="#d6d3d1"/><text x="78" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Аккаунт</text><foreignObject x="76" y="722" width="284" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:1.3;color:#6b7280;">isActive = false, вход запрещён</div></foreignObject><rect x="396" y="680" width="316" height="105" rx="8" fill="#ffffff" stroke="#d6d3d1"/><text x="414" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Назначения</text><foreignObject x="412" y="722" width="284" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:1.3;color:#6b7280;">закрыть датой, будущие удалить</div></foreignObject><rect x="732" y="680" width="316" height="105" rx="8" fill="#ffffff" stroke="#d6d3d1"/><text x="750" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Задачи</text><foreignObject x="748" y="722" width="284" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:1.3;color:#6b7280;">переназначить или оставить</div></foreignObject><rect x="1068" y="680" width="316" height="105" rx="8" fill="#ffffff" stroke="#d6d3d1"/><text x="1086" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Заявки pending</text><foreignObject x="1084" y="722" width="284" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:1.3;color:#6b7280;">отклонить</div></foreignObject><rect x="1404" y="680" width="316" height="105" rx="8" fill="#ffffff" stroke="#d6d3d1"/><text x="1422" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">История</text><foreignObject x="1420" y="722" width="284" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px;line-height:1.3;color:#6b7280;">табель, payroll, события, аудит</div></foreignObject><text x="60" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Восстановление возвращает статус active и доступ, но закрытые назначения и отклонённые заявки автоматически не восстанавливаются.</text><text x="60" y="876" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9ca3af">НИР · HR-система · 18.11.2026</text>
</svg>