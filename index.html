<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Информационная система кадрового учёта организации" />
    <title>Кадровый учёт</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Cpath d='M9 26V13a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v13' stroke='%23f1eee7' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M13 11v-3h6v3M10 17h4M18 17h4M10 21h4M18 21h4' stroke='%23f1eee7' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      try {
        var raw = localStorage.getItem('hr-theme');
        var parsed = raw ? JSON.parse(raw) : null;
        var theme = parsed && parsed.state && parsed.state.theme === 'light' ? 'light' : 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        /* noop */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
